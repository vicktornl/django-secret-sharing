[tox]
envlist = py{311,312,313,314,315}-django{52,60,61}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[testenv]
commands = pytest {posargs}
basepython = 
    py311: python3.11
    py312: python3.12
    py313: python3.13
    py314: python3.14
    py315: python3.15
deps =
    django52: Django~=5.2.0
    django60: Django~=6.0.0
    django61: Django~=6.1.0
extras = aws,test
